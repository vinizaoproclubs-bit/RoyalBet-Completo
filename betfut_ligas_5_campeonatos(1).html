<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetFut — Simulador de ligas</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f5f7fb;font-family:Arial,sans-serif}header{background:#121c2d;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a,button{background:#263e61;color:white;border:1px solid #486084;padding:11px 15px;border-radius:10px;text-decoration:none;cursor:pointer}main{max-width:900px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#18253a;border:1px solid #2a3952;border-radius:14px;padding:18px;margin:12px 0}.card button{margin-top:10px}h1{font-size:26px}.muted{color:#a9b9ce}.score{font-size:23px;color:#20d889;font-weight:bold}select{padding:10px;background:#101d31;color:white;border:1px solid #486084;border-radius:8px}</style></head><body><header><b>⚽ BetFut • Ligas</b><a href="index.html">← Voltar ao RoyalBet</a></header><main><h1>Simulador de futebol</h1><p class="muted">Escolha uma liga, dê seu palpite e simule partidas. Sem apostas, débitos ou prêmios. Seu saldo do RoyalBet não é alterado.</p><div id="leagues" class="grid"></div><section id="matches"></section></main><script>
const leagues=[['🇧🇷 Brasileirão',['Palmeiras','Flamengo','Corinthians','São Paulo','Santos','Fluminense','Botafogo','Grêmio']],['🏴 Premier League',['Arsenal','Liverpool','Manchester City','Chelsea','Manchester United','Tottenham','Newcastle','Aston Villa']],['🇪🇸 La Liga',['Real Madrid','Barcelona','Atlético de Madrid','Sevilla','Valencia','Villarreal','Real Sociedad','Athletic Bilbao']],['🇮🇹 Serie A',['Inter','Milan','Juventus','Napoli','Roma','Lazio','Atalanta','Fiorentina']],['🇩🇪 Bundesliga',['Bayern de Munique','Borussia Dortmund','Bayer Leverkusen','RB Leipzig','Stuttgart','Frankfurt','Wolfsburg','Werder Bremen']]];
const root=document.getElementById('leagues'),matches=document.getElementById('matches');leagues.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l[0];b.onclick=()=>show(i);root.appendChild(b)});
function show(i){const l=leagues[i],teams=l[1];matches.innerHTML='';const title=document.createElement('h2');title.textContent=l[0]+' — Rodada simulada';matches.appendChild(title);for(let n=0;n<4;n++){const a=teams[n],b=teams[7-n],c=document.createElement('article');c.className='card';const heading=document.createElement('h3');heading.textContent=a+' × '+b;c.appendChild(heading);const label=document.createElement('label');label.textContent='Seu palpite: ';const select=document.createElement('select');['Selecione','Vitória '+a,'Empate','Vitória '+b].forEach((t,j)=>{let o=document.createElement('option');o.value=j;o.textContent=t;select.appendChild(o)});label.appendChild(select);c.appendChild(label);const result=document.createElement('p');result.className='score';const btn=document.createElement('button');btn.textContent='Simular partida';btn.onclick=()=>{const x=Math.floor(Math.random()*5),y=Math.floor(Math.random()*5);result.textContent=a+' '+x+' × '+y+' '+b+(select.value==='0'?'':(' • Palpite '+(Number(select.value)===(x>y?1:x===y?2:3)?'acertado!':'não acertado.')));btn.disabled=true};c.append(btn,result);matches.appendChild(c)}}
</script></body></html>
